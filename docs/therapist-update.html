<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session update · Hop to Heal</title>
<meta name="description" content="Team page: update a child after a session.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FBA826">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Figtree:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EEF3EA}
a{color:#A8421A}a:hover{color:#7C2F10}
.w{max-width:1280px;margin:0 auto;padding:0 24px;box-sizing:border-box}
.d{font-family:'Fredoka',sans-serif;font-weight:600;line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
.lb{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#645650}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:800;font-size:15px;text-decoration:none;border-radius:999px;border:0;padding:9px 18px;cursor:pointer;box-sizing:border-box;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.btn:hover{transform:translateY(-2px)}
.p{background:#FBA826;color:#2B211E;box-shadow:0 3px 0 #C97F0C}
.s{background:#FFFFFF;color:#2B211E;box-shadow:inset 0 0 0 2px #2B211E}
.k{background:#1E5C46;color:#FFFFFF;box-shadow:0 3px 0 #123D2E}
.card{background:#FFFFFF;border-radius:26px;box-shadow:0 1px 0 #E3DCD2,0 12px 30px rgba(43,33,30,.06)}
.ch{font:inherit;font-weight:800;font-size:14px;border:0;border-radius:999px;padding:8px 14px;cursor:pointer;background:#F6FAF3;color:#2B211E;box-shadow:inset 0 0 0 2px #E3DCD2}
.ch.on{background:#FFEDC9;box-shadow:inset 0 0 0 2.5px #2B211E}
.lv{font:inherit;font-weight:800;font-size:14px;width:44px;height:40px;border:0;border-radius:12px;cursor:pointer;background:#F6FAF3;color:#2B211E;box-shadow:inset 0 0 0 2px #E3DCD2}
.lv.on{background:#1E5C46;color:#FFFFFF;box-shadow:none}
textarea,input[type=text]{font:inherit;width:100%;box-sizing:border-box;border:2px solid #E3DCD2;border-radius:16px;padding:12px 14px;background:#FFFFFF;color:#2B211E;resize:vertical}
textarea:focus,input:focus,button:focus-visible,a:focus-visible{outline:3px solid #2B211E;outline-offset:2px}
label{font-weight:800}
.in{animation:in .5s cubic-bezier(.34,1.4,.64,1) both}
@keyframes in{from{opacity:0;transform:translateY(20px)}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
<link rel="stylesheet" href="assets/site.css">
<script src="assets/app.js"></script>
</head>
<body style="background: #EEF3EA">
<div class="preview-bar" role="note">Preview site: example data only. Sign-in, saved accounts and payments are not live yet.</div>
<div id="app"></div>
<noscript><p style="padding: 24px; font-family: sans-serif">Please turn on JavaScript to use this site, or call Hop to Heal on +91 95994 33591.</p></noscript>

<!-- What the page shows. {{name}} values come from renderVals() in the script below. -->
<template id="view">
<div style="font-family: 'Figtree', system-ui, sans-serif; color: #2B211E; background: #EEF3EA; font-size: 16px; line-height: 1.5">
<header style="background: #1E5C46; color: #FFFFFF"><div class="w" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 24px; padding-top: 12px; padding-bottom: 12px">
<div style="display: flex; align-items: center; gap: 14px"><span class="d" style="font-size: 26px; color: #FBA826">Hop to Heal</span><span style="font-weight: 800; font-size: 13px; background: rgba(255,255,255,.16); padding: 4px 12px; border-radius: 999px">Therapist portal</span></div>
<nav aria-label="Therapist" style="display: flex; flex-wrap: wrap; gap: 6px 24px; font-weight: 700"><a href="therapist.html" style="color: #FFFFFF; text-decoration: none">Today</a><a href="therapist-update.html" aria-current="page" style="color: #FBA826; text-decoration: none">Children</a><a href="therapist.html" style="color: #FFFFFF; text-decoration: none">HopCheck reviews</a></nav>
<span style="display: flex; align-items: center; gap: 10px; font-weight: 800"><img src="assets/img/team-jiya-gupta.jpg" alt="" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid #FBA826">Jiya Gupta</span>
</div></header>

<main class="w" style="padding-top: 26px; padding-bottom: 80px; display: flex; flex-direction: column; gap: 20px">
<a href="therapist.html" style="font-weight: 800">Back to today</a>
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px">
<div style="display: flex; gap: 16px; align-items: center"><span style="width: 72px; height: 72px; border-radius: 50%; background: #FBA826; display: inline-flex; align-items: center; justify-content: center; flex: none" class="d"><span style="font-size: 34px">M</span></span><div><p class="lb" style="margin: 0; color: #A8421A">Session 7 of 15 · Mon 16 Nov, 11:00 · example data</p><h1 class="d" style="font-size: 44px">Update Meera's session</h1><span style="color: #645650">Meera Sharma, 9 · OT + learning support · parent: Priya Sharma</span></div></div>
<span style="font-weight: 800; font-size: 14px; background: #FFFFFF; padding: 8px 14px; border-radius: 999px; box-shadow: inset 0 0 0 2px #E3DCD2">{{saveState}}</span>
</div>

<sc-if value="{{published}}">
<div role="status" class="card in" style="padding: 22px 26px; background: #DDEEDD; box-shadow: inset 0 0 0 2.5px #1E5C46; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between"><div><strong class="d" style="font-size: 24px">Published. Priya can see it now.</strong><div style="font-size: 15px">She gets a WhatsApp and email nudge: "Meera's session note is ready." The private note stays with the care team only.</div></div><div style="display: flex; gap: 8px; flex-wrap: wrap"><button type="button" class="btn s" onClick="{{unpublish}}">Edit again</button><a class="btn k" href="child.html">See the parent's view</a></div></div>
</sc-if>

<div style="display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(min(320px, 100%), 1fr); gap: 22px; align-items: start">
<div style="display: flex; flex-direction: column; gap: 20px">

<section class="card in" aria-labelledby="s1" style="padding: 24px; display: flex; flex-direction: column; gap: 12px">
<h2 id="s1" class="d" style="font-size: 24px">1. Attendance</h2>
<div role="radiogroup" aria-label="Attendance" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{attOpts}}" as="a"><button type="button" role="radio" aria-checked="{{a.sel}}" class="{{a.cls}}" onClick="{{a.pick}}">{{a.label}}</button></sc-for>
</div>
<span style="font-size: 14px; color: #645650">{{attNote}}</span>
</section>

<section class="card in" aria-labelledby="s2" style="padding: 24px; display: flex; flex-direction: column; gap: 14px">
<div><h2 id="s2" class="d" style="font-size: 24px">2. Goals today</h2><span style="font-size: 14px; color: #645650">Goal attainment scale: −2 much less than expected, 0 expected level, +2 much more than expected.</span></div>
<sc-for list="{{goalRows}}" as="g">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 16px; align-items: center; padding-top: 12px; border-top: 1px solid #EEE8E0">
<div><strong>{{g.name}}</strong><div style="font-size: 14px; color: #645650">Last session: {{g.last}} · {{g.word}}</div></div>
<div role="radiogroup" aria-label="{{g.name}}" style="display: flex; gap: 6px"><sc-for list="{{g.levels}}" as="l"><button type="button" role="radio" aria-checked="{{l.sel}}" class="{{l.cls}}" onClick="{{l.pick}}">{{l.label}}</button></sc-for></div>
</div>
</sc-for>
</section>

<section class="card in" aria-labelledby="s3" style="padding: 24px; display: flex; flex-direction: column; gap: 10px">
<h2 id="s3" class="d" style="font-size: 24px">3. Note for the parent</h2>
<label for="note" style="font-size: 14px; color: #645650; font-weight: 600">Plain words, no jargon. Start with something that went well.</label>
<textarea id="note" rows="4" value="{{note}}" onInput="{{setNote}}"></textarea>
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center"><span style="font-size: 14px; font-weight: 800">Quick starts:</span><sc-for list="{{starters}}" as="q"><button type="button" class="ch" onClick="{{q.use}}">{{q.label}}</button></sc-for></div>
</section>

<section class="card in" aria-labelledby="s4" style="padding: 24px; display: flex; flex-direction: column; gap: 10px">
<h2 id="s4" class="d" style="font-size: 24px">4. This week at home</h2>
<label for="tip" style="font-size: 14px; color: #645650; font-weight: 600">One small activity, 5 to 10 minutes. It shows on the parent's care tips.</label>
<input id="tip" type="text" value="{{tip}}" onInput="{{setTip}}">
</section>

<section class="card in" aria-labelledby="s5" style="padding: 24px; background: #2B211E; color: #FFFFFF; display: flex; flex-direction: column; gap: 10px">
<h2 id="s5" class="d" style="font-size: 24px">5. Private note <span style="font-family: 'Figtree', sans-serif; font-size: 13px; font-weight: 800; background: #FBA826; color: #2B211E; padding: 3px 10px; border-radius: 999px; vertical-align: middle">Care team only</span></h2>
<label for="priv" style="font-size: 14px; font-weight: 600">Parents never see this box.</label>
<textarea id="priv" rows="2" value="{{priv}}" onInput="{{setPriv}}"></textarea>
</section>

<section class="card in" aria-labelledby="s6" style="padding: 24px; display: flex; flex-direction: column; gap: 12px">
<h2 id="s6" class="d" style="font-size: 24px">6. Report (optional)</h2>
<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; border: 2px dashed #C9BFB2; border-radius: 18px; padding: 16px"><div><strong>{{reportTitle}}</strong><div style="font-size: 14px; color: #645650">{{reportNote}}</div></div><button type="button" class="btn s" onClick="{{toggleReport}}">{{reportBtn}}</button></div>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center"><button type="button" class="btn p" style="font-size: 17px; padding: 13px 26px" onClick="{{publish}}">Publish to parent</button><button type="button" class="btn s" onClick="{{saveDraft}}">Save draft</button><span style="font-size: 14px; color: #645650">Nothing reaches the parent until you publish.</span></div>
</div>

<aside aria-labelledby="pv" style="position: sticky; top: 16px; display: flex; flex-direction: column; gap: 12px">
<h2 id="pv" class="lb" style="margin: 0">What Priya will see</h2>
<div class="card" style="padding: 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 0 0 3px #FBA826, 0 14px 34px rgba(43,33,30,.1)">
<div style="display: flex; justify-content: space-between; gap: 10px; align-items: center; flex-wrap: wrap"><strong class="d" style="font-size: 22px">Session 7 · 16 Nov</strong><span style="font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 999px; background: #DDEEDD; color: #1E5C46">{{attLabel}}</span></div>
<sc-if value="{{showGoals}}">
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{goalRows}}" as="g">
<div><div style="display: flex; justify-content: space-between; gap: 8px; font-size: 14px"><strong>{{g.name}}</strong><span style="font-weight: 800; color: #1E5C46">{{g.parentWord}}</span></div><div aria-hidden="true" style="height: 10px; border-radius: 999px; background: #EEE8E0; margin-top: 4px; overflow: hidden"><div style="height: 100%; border-radius: 999px; background: #1E5C46; transition: width .4s; width: {{g.pct}}"></div></div></div>
</sc-for>
</div>
</sc-if>
<div style="background: #FFEDC9; border-radius: 16px; padding: 14px"><div class="lb" style="color: #2B211E">From Jiya</div><p style="margin: 4px 0 0; white-space: pre-wrap">{{notePreview}}</p></div>
<div style="background: #F6FAF3; border-radius: 16px; padding: 14px"><div class="lb">Try at home this week</div><p style="margin: 4px 0 0">{{tipPreview}}</p></div>
<sc-if value="{{hasReport}}"><div style="border-radius: 16px; padding: 12px 14px; box-shadow: inset 0 0 0 2px #E3DCD2; font-size: 14px"><strong>Progress report</strong><br>Shows here after Dr. Heena countersigns.</div></sc-if>
</div>
<span style="font-size: 13px; color: #645650">The private note is not in this preview because parents never get it.</span>
</aside>
</div>
</main>
</div>
</template>

<!-- What the page does. -->
<script>
class Component extends DCLogic {
  state = {
    att: 'present',
    goals: [1, 0, 0],
    note: 'Meera copied six lines from the board today without losing her place. She asked for a movement break by herself, which is a big step.',
    tip: 'Wall push-ups, 10 slow ones, before homework. Then 5 minutes of copying a short poem.',
    priv: 'Tires after 35 min. Try seating disc next time.',
    report: false,
    published: false,
    saved: 'Draft · not saved yet'
  };
  renderVals() {
    const s = this.state;
    const atts = [['present', 'Came'], ['late', 'Came late'], ['absent', 'Did not come'], ['moved', 'Rescheduled']];
    const attNotes = {
      present: 'One session is taken from the 15-day pack.',
      late: 'One session is taken from the pack. The parent sees "came late".',
      absent: 'Follows your no-show policy. [Confirm: does a no-show use a pack session?]',
      moved: 'No session is taken. The parent is asked to pick a new slot.'
    };
    const attLabels = { present: 'Attended', late: 'Came late', absent: 'Missed', moved: 'Rescheduled' };
    const names = ['Copies from the board without losing place', 'Sits and works for 15 minutes', 'Holds pencil with three fingers'];
    const last = [0, 0, -1];
    const words = { '-2': 'much less than expected', '-1': 'a little less than expected', '0': 'at the expected level', '1': 'a little better than expected', '2': 'much better than expected' };
    const parentWords = { '-2': 'Needs more time', '-1': 'Getting there', '0': 'On track', '1': 'Ahead', '2': 'Far ahead' };
    const fmt = (n) => (n > 0 ? '+' + n : n < 0 ? '−' + Math.abs(n) : '0');
    const goalRows = names.map((name, i) => ({
      name,
      last: fmt(last[i]),
      word: 'today ' + words[String(s.goals[i])],
      parentWord: parentWords[String(s.goals[i])],
      pct: ((s.goals[i] + 2) / 4 * 100) + '%',
      levels: [-2, -1, 0, 1, 2].map((v) => ({
        label: fmt(v),
        sel: s.goals[i] === v ? 'true' : 'false',
        cls: 'lv' + (s.goals[i] === v ? ' on' : ''),
        pick: () => { const g = s.goals.slice(); g[i] = v; this.setState({ goals: g, saved: 'Unsaved changes' }); }
      }))
    }));
    const starters = [
      ['Went well', 'Today went well. '],
      ['Tough day', 'Today was a harder day, and that is normal. '],
      ['New skill', 'A new skill showed up today: ']
    ].map(([label, text]) => ({ label, use: () => this.setState({ note: text + s.note, saved: 'Unsaved changes' }) }));
    return {
      published: s.published,
      saveState: s.published ? 'Published to parent' : s.saved,
      attOpts: atts.map(([k, label]) => ({ label, sel: s.att === k ? 'true' : 'false', cls: 'ch' + (s.att === k ? ' on' : ''), pick: () => this.setState({ att: k, saved: 'Unsaved changes' }) })),
      attNote: attNotes[s.att],
      attLabel: attLabels[s.att],
      showGoals: s.att === 'present' || s.att === 'late',
      goalRows,
      starters,
      note: s.note,
      notePreview: s.note.trim() || 'Your note will show here.',
      setNote: (e) => this.setState({ note: e.target.value, saved: 'Unsaved changes' }),
      tip: s.tip,
      tipPreview: s.tip.trim() || 'Your home activity will show here.',
      setTip: (e) => this.setState({ tip: e.target.value, saved: 'Unsaved changes' }),
      priv: s.priv,
      setPriv: (e) => this.setState({ priv: e.target.value, saved: 'Unsaved changes' }),
      hasReport: s.report,
      reportTitle: s.report ? 'Meera_progress_Nov.pdf attached' : 'No report attached',
      reportNote: s.report ? 'Waiting for Dr. Heena Gupta to countersign. The parent sees it only after that.' : 'PDF only. Every report needs Dr. Heena’s countersign before the parent sees it.',
      reportBtn: s.report ? 'Remove' : 'Attach PDF',
      toggleReport: () => this.setState({ report: !s.report, saved: 'Unsaved changes' }),
      publish: () => this.setState({ published: true }),
      unpublish: () => this.setState({ published: false, saved: 'Unsaved changes' }),
      saveDraft: () => this.setState({ saved: 'Draft saved just now' })
    };
  }
}
HopApp.mount(Component, {});
</script>
</body>
</html>
