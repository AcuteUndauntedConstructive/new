@keyframes pulse{50%{box-shadow:0 4px 0 #123D2E,0 0 0 10px rgba(30,92,70,.18)}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

<!-- What the page does. -->
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: null, unlocked: null };
  }
  renderVals() {
    const p = (this.state.tab ?? (this.props.section ?? 'Parent')) === 'Parent';
    const un = this.state.unlocked ?? (this.props.meetUnlocked ?? false);
    return {
      isParent: p, isKids: !p,
      parentSel: p ? 'true' : 'false', kidsSel: p ? 'false' : 'true',
      parentBg: p ? '#2B211E' : 'transparent', parentFg: p ? '#FFFFFF' : '#2B211E', kidsBg: p ? 'transparent' : '#2B211E', kidsFg: p ? '#2B211E' : '#FFFFFF',
      showParent: () => this.setState({ tab: 'Parent' }), showKids: () => this.setState({ tab: 'Children' }),
      locked: !un, unlocked: un,
      meetLine: un ? 'It is 6:26 pm. Your link is ready, and we have sent it on WhatsApp too.' : 'Your Google Meet link appears here and on WhatsApp 5 minutes before the session.',
      toggleTime: () => this.setState({ unlocked: !un }),
      timeLabel: un ? 'Preview: back to earlier in the day' : 'Preview: jump to 5 minutes before',
      cDots: Array.from({ length: 21 }, (_, i) => ({ c: i < 3 ? '#1E5C46' : i === 3 ? '#FBA826' : '#E3DCD2' })),
      tDots: Array.from({ length: 15 }, (_, i) => ({ c: i < 6 ? '#1E5C46' : '#E3DCD2' }))
    };
  }
}
HopApp.mount(Component, {"section": "Parent", "meetUnlocked": false});
</script>
