<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HopCheck for grown-ups · Hop to Heal</title>
<meta name="description" content="The grown-up part of HopCheck.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FBA826">
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Figtree:wght@400;600;700;800&amp;family=Baloo+2:wght@700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFEDC9}
a{color:#A8421A}a:hover{color:#7C2F10}
.d{font-family:'Fredoka','Baloo 2',sans-serif;font-weight:600;line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
.eb{margin:0;font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:#A8421A}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font:inherit;font-weight:800;font-size:17px;text-decoration:none;border-radius:999px;border:0;padding:14px 26px;cursor:pointer;box-sizing:border-box;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.btn:hover{transform:translateY(-3px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.p{background:#FBA826;color:#2B211E;box-shadow:0 4px 0 #C97F0C}
.s{background:#FFFFFF;color:#2B211E;box-shadow:inset 0 0 0 2px #2B211E}
.opt{font:inherit;font-weight:700;font-size:16px;border:0;border-radius:16px;padding:12px 16px;cursor:pointer;color:#2B211E;transition:transform .12s}
.opt:hover{transform:translateY(-2px)}
.side{font:inherit;text-align:left;border:0;background:transparent;border-radius:14px;padding:8px 12px;cursor:pointer;color:#2B211E;display:flex;align-items:center;gap:10px;width:100%;font-weight:700;font-size:15.5px}
.side:hover{background:rgba(255,255,255,.6)}
.step{animation:step .4s cubic-bezier(.34,1.3,.64,1) both}
@keyframes step{from{opacity:0;transform:translateX(30px)}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
<link rel="stylesheet" href="assets/site.css">
<script src="assets/app.js"></script>
</head>
<body style="background: #FFEDC9">
<div class="preview-bar" role="note">Preview site: example data only. Sign-in, saved accounts and payments are not live yet.</div>
<div id="app"></div>
<noscript><p style="padding: 24px; font-family: sans-serif">Please turn on JavaScript to use this site, or call Hop to Heal on +91 95994 33591.</p></noscript>

<!-- What the page shows. {{name}} values come from renderVals() in the script below. -->
<template id="view">
<div style="font-family: 'Figtree', system-ui, sans-serif; color: #2B211E; background: #FFEDC9; font-size: 18px; line-height: 1.55">
<header style="max-width: 1240px; margin: 0 auto; padding: 14px 24px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px">
<a href="hopcheck.html" aria-label="Back to HopCheck" style="line-height: 0"><img src="assets/img/logo.png" alt="Hop to Heal" style="height: 56px; width: auto"></a>
<div style="flex: 1 1 260px; min-width: 0"><div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 800"><span>The grown-up check</span><span>{{pct}}% done</span></div><div style="height: 10px; border-radius: 5px; background: #FFFFFF; overflow: hidden; margin-top: 4px"><div style="height: 100%; width: {{pct}}%; background: #1E5C46; border-radius: 5px; transition: width .4s"></div></div></div>
<div style="display: flex; gap: 8px; align-items: center"><button type="button" class="opt" onClick="{{setEN}}" aria-pressed="{{enPressed}}" style="padding: 7px 14px; font-size: 14px; background: {{enBg}}">English</button><button type="button" class="opt" onClick="{{setHI}}" aria-pressed="{{hiPressed}}" style="padding: 7px 14px; font-size: 14px; background: {{hiBg}}">हिंदी</button><a href="sign-in.html" style="font-weight: 800; font-size: 15px; margin-left: 6px">Save &amp; finish later</a></div>
</header>

<main style="max-width: 1240px; margin: 0 auto; padding: 12px 24px 80px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start">
<nav aria-label="Sections" style="flex: 1 1 250px; max-width: 320px; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{sections}}" as="s">
<button type="button" class="side" onClick="{{s.go}}" aria-current="{{s.current}}" style="background: {{s.bg}}"><span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 50%; flex: none; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; background: {{s.dotBg}}; color: {{s.dotFg}}">{{s.mark}}</span>{{s.label}}</button>
</sc-for>
</nav>

<div style="flex: 999 1 560px; min-width: 0; background: #FFFFFF; border-radius: 36px; padding: 40px; box-sizing: border-box; box-shadow: 0 24px 60px rgba(43,33,30,.12)">

<sc-if value="{{isIntro}}"><div class="step" style="display: flex; flex-direction: column; gap: 16px">
<p class="eb">Free · about 8 minutes · private</p>
<h1 class="d" style="font-size: 46px">{{introTitle}}</h1>
<p style="margin: 0; color: #645650">{{introBody}}</p>
<div id="who-l" style="font-weight: 800">I am the child's…</div>
<div role="group" aria-labelledby="who-l" style="display: flex; flex-wrap: wrap; gap: 10px"><sc-for list="{{roles}}" as="r"><button type="button" class="opt" onClick="{{r.pick}}" aria-pressed="{{r.pressed}}" style="background: {{r.bg}}; box-shadow: {{r.sh}}">{{r.label}}</button></sc-for></div>
<div style="background: #F6FAF3; border-radius: 18px; padding: 14px 18px; font-size: 16px"><strong>A screening, not a diagnosis.</strong> A therapist reads every answer before you see any result.</div>
</div></sc-if>

<sc-if value="{{isConsent}}"><div class="step" style="display: flex; flex-direction: column; gap: 16px">
<h1 class="d" style="font-size: 42px">Your permission</h1>
<p style="margin: 0; color: #645650">We need your consent to collect information about your child. You can withdraw it at any time in your account.</p>
<label style="display: flex; gap: 12px; align-items: flex-start; cursor: pointer"><input type="checkbox" checked="{{c1}}" onChange="{{toggleC1}}" style="width: 24px; height: 24px; margin-top: 3px; accent-color: #1E5C46; flex: none">I am this child's parent or legal guardian, and I agree that Hop to Heal can use my answers to screen my child and advise me. <a href="index.html">Privacy policy</a></label>
<label style="display: flex; gap: 12px; align-items: flex-start; cursor: pointer"><input type="checkbox" checked="{{c2}}" onChange="{{toggleC2}}" style="width: 24px; height: 24px; margin-top: 3px; accent-color: #1E5C46; flex: none">My child (7 or older) may answer the "My turn!" questions. (Optional)</label>
<label style="display: flex; gap: 12px; align-items: flex-start; cursor: pointer"><input type="checkbox" checked="{{c3}}" onChange="{{toggleC3}}" style="width: 24px; height: 24px; margin-top: 3px; accent-color: #1E5C46; flex: none">Send the result and reminders on WhatsApp. (Optional)</label>
</div></sc-if>

<sc-if value="{{isChild}}"><div class="step" style="display: flex; flex-direction: column; gap: 16px">
<h1 class="d" style="font-size: 42px">About your child</h1>
<label for="cn" style="font-weight: 800">First name</label>
<input id="cn" type="text" value="{{child}}" onInput="{{onChild}}" autocomplete="off" style="font: inherit; padding: 13px 16px; border-radius: 16px; border: 2px solid #E3DCD2; background: #F6FAF3; color: #2B211E; max-width: 360px">
<div id="age-l" style="font-weight: 800">Age in years</div>
<div role="group" aria-labelledby="age-l" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(58px, 100%), 1fr)); gap: 8px"><sc-for list="{{ages}}" as="a"><button type="button" class="opt" onClick="{{a.pick}}" aria-pressed="{{a.pressed}}" style="background: {{a.bg}}; box-shadow: {{a.sh}}; font-size: 18px">{{a.label}}</button></sc-for></div>
<p style="margin: 0; font-size: 15px; color: #645650">{{bandNote}}</p>
<div id="dx-l" style="font-weight: 800">Has a doctor already told you about any of these? <span style="font-weight: 600; color: #645650">(optional)</span></div>
<div role="group" aria-labelledby="dx-l" style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{dx}}" as="x"><button type="button" class="opt" onClick="{{x.toggle}}" aria-pressed="{{x.pressed}}" style="background: {{x.bg}}; box-shadow: {{x.sh}}; font-size: 15px; padding: 9px 14px">{{x.label}}</button></sc-for></div>
</div></sc-if>

<sc-if value="{{isSafety}}"><div class="step" style="display: flex; flex-direction: column; gap: 12px">
<p class="eb">Safety first</p>
<h1 class="d" style="font-size: 42px">Four important questions</h1>
<p style="margin: 0; color: #645650">These tell us if {{childName}} needs help quickly.</p>
<sc-for list="{{flags}}" as="f"><div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 0; border-bottom: 1px solid #E3DCD2"><span style="flex: 1 1 340px; font-weight: 700">{{f.q}}</span><div style="display: flex; gap: 8px"><button type="button" class="opt" onClick="{{f.yes}}" aria-pressed="{{f.yesPressed}}" style="background: {{f.yesBg}}; box-shadow: {{f.yesSh}}">Yes</button><button type="button" class="opt" onClick="{{f.no}}" aria-pressed="{{f.noPressed}}" style="background: {{f.noBg}}; box-shadow: {{f.noSh}}">No</button></div></div></sc-for>
<sc-if value="{{urgent}}"><div role="alert" style="background: #FBE4E0; box-shadow: inset 0 0 0 2px #B83232; border-radius: 20px; padding: 16px 20px"><strong class="d" style="font-size: 24px; color: #8E2626">Please see a doctor today</strong><p style="margin: 6px 0 0; font-size: 16px">What you have told us needs a doctor's attention soon. Please visit your paediatrician or nearest hospital today. Emergency: 112. Mental-health support: Tele-MANAS 14416. A Hop to Heal therapist will also call you today. You can still finish the questions.</p></div></sc-if>
</div></sc-if>

<sc-if value="{{isArea}}"><div class="step" style="display: flex; flex-direction: column; gap: 8px">
<p class="eb">{{areaCount}} · {{bandLabel}}</p>
<h1 class="d" style="font-size: 42px">{{areaTitle}}</h1>
<p style="margin: 0 0 6px; color: #645650">Thinking about {{childName}} over the last month, how much of a worry is each of these?</p>
<sc-for list="{{questions}}" as="q"><div style="padding: 16px 0; border-top: 1px solid #E3DCD2; display: flex; flex-direction: column; gap: 10px"><span style="font-weight: 700; font-size: 19px">{{q.text}}</span><div role="group" aria-label="{{q.text}}" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px"><sc-for list="{{q.opts}}" as="o"><button type="button" class="opt" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="background: {{o.bg}}; box-shadow: {{o.sh}}">{{o.label}}</button></sc-for></div></div></sc-for>
</div></sc-if>

<sc-if value="{{isYou}}"><div class="step" style="display: flex; flex-direction: column; gap: 8px">
<p class="eb">Last part · about you</p>
<h1 class="d" style="font-size: 42px">And how are you doing?</h1>
<p style="margin: 0 0 6px; color: #645650">Caring for a child takes a lot. These four answers help us look after you too.</p>
<sc-for list="{{youQs}}" as="q"><div style="padding: 16px 0; border-top: 1px solid #E3DCD2; display: flex; flex-direction: column; gap: 10px"><span style="font-weight: 700; font-size: 19px">{{q.text}}</span><div role="group" aria-label="{{q.text}}" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px"><sc-for list="{{q.opts}}" as="o"><button type="button" class="opt" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="background: {{o.bg}}; box-shadow: {{o.sh}}">{{o.label}}</button></sc-for></div></div></sc-for>
</div></sc-if>

<sc-if value="{{isDone}}"><div class="step" style="display: flex; flex-direction: column; gap: 16px">
<sc-if value="{{urgent}}"><div role="alert" style="background: #FBE4E0; box-shadow: inset 0 0 0 2px #B83232; border-radius: 20px; padding: 16px 20px"><strong class="d" style="font-size: 24px; color: #8E2626">Please see a doctor today</strong><p style="margin: 6px 0 0; font-size: 16px">Emergency: 112 · Tele-MANAS: 14416. A therapist will call you today.</p></div></sc-if>
<p class="eb">All done</p>
<h1 class="d" style="font-size: 46px">Thank you. Your answers are with our therapist.</h1>
<p style="margin: 0; color: #645650">We received 24 answers about {{childName}} and 4 about you. You will not see a result until a therapist has read and signed it.</p>
<ol style="margin: 0; padding-left: 24px; display: flex; flex-direction: column; gap: 6px"><li><strong>Within 2 working days</strong> a master's-level therapist reviews everything and may call you.</li><li><strong>Your signed report</strong> arrives on WhatsApp and in your portal, with the services that fit.</li><li><strong>You decide</strong> what to book. A 15-minute call to talk it through is free.</li></ol>
<sc-if value="{{kidCanAnswer}}"><div style="background: #1E5C46; color: #FFFFFF; border-radius: 24px; padding: 20px 24px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between"><span style="flex: 1 1 300px"><strong class="d" style="font-size: 24px">Now it's {{childName}}'s turn</strong><br>Hand over the phone for 10 friendly questions with Hoppy.</span><a class="btn p" href="hopcheck-child.html">Start "My turn!"</a></div></sc-if>
<div style="display: flex; flex-wrap: wrap; gap: 12px"><a class="btn s" href="sign-in.html">Save to my account with Google</a><a class="btn s" href="hopcheck-result.html">See a sample report</a></div>
</div></sc-if>

<sc-if value="{{showNav}}"><div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 30px; flex-wrap: wrap">
<button type="button" class="btn s" onClick="{{back}}" disabled="{{atStart}}">Back</button>
<span style="font-size: 15px; color: #A8421A; font-weight: 700">{{hint}}</span>
<button type="button" class="btn p" onClick="{{next}}" disabled="{{blocked}}">{{nextLabel}}</button>
</div></sc-if>
</div>
</main>
</div>
</template>

<!-- What the page does. -->
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: null, lang: 'EN', role: 'Mother', c1: true, c2: true, c3: true, child: 'Meera', age: 9, flags: { lost: false, sound: false, fits: false, harm: false }, ans: {}, you: {} };
  }
  bank() {
    return {
      areas: ['Talking & understanding', 'Moving & hands', 'Senses', 'Attention & activity', 'Feelings & behaviour', 'Play & friends', 'Learning & school', 'Daily living'],
      little: [
        ['Uses fewer words than other children the same age', 'Family find it hard to understand what they say', 'Doesn’t follow simple instructions like “bring your shoes”'],
        ['Falls, trips or bumps into things often', 'Struggles with crayons, spoons or building blocks', 'Avoids climbing, jumping or running'],
        ['Gets very upset by loud sounds, haircuts or certain clothes', 'Eats only a few foods, or gags on textures', 'Constantly spins, crashes into things or chews on objects'],
        ['Can’t stay with one toy or activity for a few minutes', 'Always on the go, even when it isn’t safe', 'Doesn’t seem to listen when spoken to'],
        ['Long or frequent tantrums that are hard to calm', 'Hits, bites or throws things when upset', 'Very fearful or clingy compared with other children'],
        ['Doesn’t look at you or respond to their name', 'Doesn’t point or bring things to show you', 'Plays alone, or lines up toys instead of pretending'],
        ['Doesn’t know colours, shapes or body parts that others their age know', 'Loses interest quickly in picture books or rhymes', 'Not ready for pre-school routines like sitting in a circle'],
        ['Hard to feed, or not feeding themselves yet', 'Not helping with dressing, or toilet training is very late', 'Sleep is a nightly struggle']
      ],
      school: [
        ['Speech is unclear, or they stammer', 'Struggles to explain what happened in their day', 'Often misunderstands instructions or jokes'],
        ['Handwriting is slow, messy or painful', 'Clumsy at sports, or avoids PE and playground games', 'Tires quickly when sitting upright or writing'],
        ['Distressed by noise, crowds or bright lights', 'Very fussy about clothes, food or being touched', 'Always fidgeting, rocking or seeking movement'],
        ['Can’t focus on homework for 15 minutes', 'Loses things and forgets instructions', 'Acts before thinking; interrupts or can’t wait their turn'],
        ['Worries a lot, or tries to avoid school', 'Angry outbursts, arguing or refusing', 'Seems sad, withdrawn or low in confidence'],
        ['Finds it hard to make or keep friends', 'Misses social cues, or says things that upset others', 'Strong fixed interests or routines; very upset by change'],
        ['Reading is slow, or letters and words get mixed up', 'Struggles with spelling or maths despite real effort', 'Marks have dropped, or teachers have raised concerns'],
        ['Needs more help than others with dressing, bathing or packing a bag', 'Poor sleep, or screens are very hard to switch off', 'Struggles to manage time, money or travel for their age']
      ],
      you: ['I feel worn out most days', 'Worry about my child affects my sleep', 'We disagree at home about how to handle things', 'I have nobody to talk to about this'],
      flags: [['lost', 'lost words or skills they used to have'], ['sound', 'stopped reacting to sounds or voices'], ['fits', 'had fits, seizures or blank spells'], ['harm', 'talked about hurting themselves, or you fear for their safety']]
    };
  }
  renderVals() {
    const st = this.state, B = this.bank();
    const labels = ['Welcome', 'Consent', 'Child'].concat(['Safety'], B.areas, ['About you', 'Done']);
    const startMap = { 'Welcome': 0, 'Consent': 1, 'Child': 2, 'Safety': 3, 'Talking': 4, 'About you': 12, 'Done': 13 };
    const step = st.step ?? (startMap[this.props.startAt ?? 'Talking'] ?? 4);
    const hi = st.lang === 'HI';
    const childName = st.child.trim() || 'your child';
    const band = st.age !== null && st.age < 6 ? 'little' : 'school';
    const areaIdx = step - 4;
    const key = (a, i) => band + '-' + a + '-' + i;
    const areaDone = (a) => [0, 1, 2].every((i) => st.ans[key(a, i)] !== undefined);
    const youDone = B.you.every((_, i) => st.you[i] !== undefined);
    const flagsDone = B.flags.every(([k]) => st.flags[k] !== undefined);
    const valid = (n) => n === 0 ? !!st.role : n === 1 ? st.c1 : n === 2 ? (st.child.trim().length > 0 && st.age !== null) : n === 3 ? flagsDone : n >= 4 && n <= 11 ? areaDone(n - 4) : n === 12 ? youDone : true;
    const doneCount = labels.slice(0, 13).filter((_, n) => valid(n) && (n < step || n === step)).length;
    const on = (c) => ({ bg: c, sh: 'inset 0 0 0 2.5px #2B211E' });
    const off = { bg: '#F6FAF3', sh: 'inset 0 0 0 2px #E3DCD2' };
    const scale = [['No worry', '#DDEEDD'], ['A little', '#FFEDC9'], ['A lot', '#FBA826']];
    const youScale = [['Rarely', '#DDEEDD'], ['Sometimes', '#FFEDC9'], ['Often', '#FBA826']];
    const go = (n) => this.setState({ step: n });
    const urgent = B.flags.some(([k]) => st.flags[k] === true);
    return {
      pct: Math.round((Math.min(step, 13) / 13) * 100),
      setEN: () => this.setState({ lang: 'EN' }), setHI: () => this.setState({ lang: 'HI' }),
      enPressed: hi ? 'false' : 'true', hiPressed: hi ? 'true' : 'false', enBg: hi ? '#FFFFFF' : '#FBA826', hiBg: hi ? '#FBA826' : '#FFFFFF',
      sections: labels.map((label, n) => { const cur = n === step; const done = n < 13 && valid(n) && n < step; return { label, current: cur ? 'step' : 'false', bg: cur ? '#FFFFFF' : 'transparent', mark: done ? '✓' : String(n + 1), dotBg: done ? '#1E5C46' : cur ? '#FBA826' : '#FFFFFF', dotFg: done ? '#FFFFFF' : '#2B211E', go: () => { if (n <= step || labels.slice(0, n).every((_, m) => valid(m))) go(n); } }; }),
      isIntro: step === 0, isConsent: step === 1, isChild: step === 2, isSafety: step === 3, isArea: step >= 4 && step <= 11, isYou: step === 12, isDone: step === 13,
      introTitle: hi ? 'आप अपने बच्चे को सबसे अच्छी तरह जानते हैं' : 'You know your child best',
      introBody: hi ? 'कुछ आसान सवाल। एक थेरेपिस्ट हर जवाब पढ़ेगा और बताएगा कि कौन-सी मदद सही रहेगी।' : 'Tell us what you notice across 8 areas of your child’s day, then a little about yourself. A therapist reads every answer and tells you which help fits.',
      roles: ['Mother', 'Father', 'Grandparent', 'Guardian', 'Other'].map((label) => { const s = st.role === label ? on('#FBA826') : off; return { label, pressed: st.role === label ? 'true' : 'false', bg: s.bg, sh: s.sh, pick: () => this.setState({ role: label }) }; }),
      c1: st.c1, c2: st.c2, c3: st.c3, toggleC1: () => this.setState({ c1: !st.c1 }), toggleC2: () => this.setState({ c2: !st.c2 }), toggleC3: () => this.setState({ c3: !st.c3 }),
      child: st.child, childName, onChild: (e) => this.setState({ child: e.target.value }),
      ages: Array.from({ length: 15 }, (_, i) => { const n = i + 2; const s = st.age === n ? on('#FBA826') : off; return { label: String(n), pressed: st.age === n ? 'true' : 'false', bg: s.bg, sh: s.sh, pick: () => this.setState({ age: n }) }; }),
      dx: ['Autism', 'ADHD', 'Down syndrome', 'Hearing loss', 'Learning disability', 'Developmental delay', 'Something else'].map((label) => { const cur = st.dx || []; const sel = cur.includes(label); const s = sel ? on('#FBA826') : off; return { label, pressed: sel ? 'true' : 'false', bg: s.bg, sh: s.sh, toggle: () => this.setState({ dx: sel ? cur.filter((v) => v !== label) : cur.concat(label) }) }; }),
      bandNote: st.age === null ? 'We ask different questions for ages 2–5 and 6–16.' : band === 'little' ? 'Ages 2–5: questions about milestones and play. The child’s own questionnaire starts at age 7.' : st.age >= 7 ? 'Ages 6–16: questions about school, friends and feelings. ' + childName + ' can also answer “My turn!”.' : 'Ages 6–16: questions about school, friends and feelings.',
      flags: B.flags.map(([k, q]) => { const v = st.flags[k]; const y = v === true ? on('#FBE4E0') : off, n = v === false ? on('#DDEEDD') : off; return { q: 'Has ' + childName + ' ' + q + '?', yesPressed: v === true ? 'true' : 'false', noPressed: v === false ? 'true' : 'false', yesBg: y.bg, yesSh: y.sh, noBg: n.bg, noSh: n.sh, yes: () => this.setState({ flags: { ...st.flags, [k]: true } }), no: () => this.setState({ flags: { ...st.flags, [k]: false } }) }; }),
      urgent,
      areaCount: areaIdx >= 0 && areaIdx < 8 ? 'Area ' + (areaIdx + 1) + ' of 8' : '',
      bandLabel: band === 'little' ? 'Questions for ages 2–5' : 'Questions for ages 6–16',
      areaTitle: B.areas[Math.max(0, Math.min(7, areaIdx))],
      questions: (B[band][Math.max(0, Math.min(7, areaIdx))] || []).map((text, i) => ({ text, opts: scale.map(([label, c], j) => { const sel = st.ans[key(areaIdx, i)] === j; const s = sel ? on(c) : off; return { label, pressed: sel ? 'true' : 'false', bg: s.bg, sh: s.sh, pick: () => this.setState({ ans: { ...st.ans, [key(areaIdx, i)]: j } }) }; }) })),
      youQs: B.you.map((text, i) => ({ text, opts: youScale.map(([label, c], j) => { const sel = st.you[i] === j; const s = sel ? on(c) : off; return { label, pressed: sel ? 'true' : 'false', bg: s.bg, sh: s.sh, pick: () => this.setState({ you: { ...st.you, [i]: j } }) }; }) })),
      kidCanAnswer: st.age !== null && st.age >= 7 && st.c2,
      showNav: step < 13, atStart: step === 0,
      back: () => go(Math.max(0, step - 1)),
      next: () => { if (valid(step)) go(step + 1); },
      blocked: !valid(step),
      hint: valid(step) ? '' : step >= 4 ? 'Please answer every question to continue' : '',
      nextLabel: step === 0 ? 'Start' : step === 12 ? 'Send to a therapist' : 'Continue'
    };
  }
}
HopApp.mount(Component, {"startAt": "Talking"});
</script>
